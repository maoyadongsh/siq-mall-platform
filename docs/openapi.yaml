      - available_stock
      - label
      - price
    SkuOutput:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          maxLength: 80
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        available_stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        version:
