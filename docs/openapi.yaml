components:
  schemas:
    ActivityResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRow'
      required:
      - code
      - data
      - message
      - request_id
      - timestamp
    ActivityRow:
      type: object
      properties:
        order_no:
          type: string
          format: uuid
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
      required:
      - occurred_at
      - order_no
      - type
    Address:
      type: object
      properties:
        recipient:
          type: string
          maxLength: 50
        phone:
          type: string
          pattern: ^\+?[0-9][0-9\- ]{6,18}$
        province:
          type: string
          maxLength: 50
        city:
          type: string
          maxLength: 50
        district:
          type: string
          maxLength: 50
        region_code:
          type: string
          pattern: ^[0-9]{6,12}$
        detail:
          type: string
          maxLength: 200
        is_default:
          type: boolean
          default: false
        id:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - city
      - created_at
      - detail
      - district
      - id
      - phone
      - province
      - recipient
      - region_code
      - updated_at
      - version
    AddressInputRequest:
      type: object
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          minLength: 1
          pattern: ^\+?[0-9][0-9\- ]{6,18}$
        province:
          type: string
          minLength: 1
          maxLength: 50
        city:
          type: string
          minLength: 1
          maxLength: 50
        district:
          type: string
          minLength: 1
          maxLength: 50
        region_code:
          type: string
          minLength: 1
          pattern: ^[0-9]{6,12}$
        detail:
          type: string
          minLength: 1
          maxLength: 200
        is_default:
          type: boolean
          default: false
      required:
      - city
      - detail
      - district
      - phone
      - province
      - recipient
      - region_code
    AddressListResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - code
      - data
      - message
      - request_id
      - timestamp
    AddressResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/Address'
      required:
      - code
      - data
      - message
      - request_id
      - timestamp
    AdjustmentInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        delta:
          type: integer
          maximum: 2147483647
          minimum: -2147483647
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - delta
      - expected_version
      - reason
