name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      APP_VERSION: "1.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock.txt
      - name: Django check
        working-directory: backend
        run: python manage.py check
      - name: Tests
        working-directory: backend
        run: python -m pytest
      - name: Lint
        working-directory: backend
        run: |
          python -m ruff check .
          python -m black --check .
      - name: OpenAPI drift
        working-directory: backend
        run: |
          python manage.py spectacular --validate --fail-on-warn --file ../docs/openapi.yaml
          git diff --exit-code -- ../docs/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Tests
        run: npm --prefix mini test
      - name: Boundaries
        run: node --test qa/acceptance/mini-boundaries.cjs
