name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      APP_VERSION: "1.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock.txt
      - name: Django check
        working-directory: backend
        run: python manage.py check
      - name: Tests
        working-directory: backend
        run: python -m pytest
      - name: Lint
        working-directory: backend
        run: |
          python -m ruff check .
          python -m black --check .
      - name: OpenAPI drift
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python manage.py spectacular --validate --fail-on-warn --file ../docs/openapi.yaml
          git diff --exit-code -- ../docs/openapi.yaml

  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: mall_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: mall_ci
      DB_USER: root
      DB_PASSWORD: ci-root
      DB_TEST_NAME: test_mall_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock.txt
      - name: MariaDB integration tests
        working-directory: backend
        run: >
          python -m pytest --no-cov -q
          --ds=config.settings.mariadb_test
          users/tests/test_address_races.py
          catalog/tests/test_stock_races.py
          cart/tests/test_race.py
          orders/tests/test_races.py
          promotions/tests/test_races.py
          reviews/tests/test_races.py
          notifications/tests/test_races.py
          content/tests/test_races.py
          support/tests/test_races.py
          ../qa/acceptance/test_delivery_boundaries.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Tests
        run: npm --prefix mini test
      - name: Boundaries
        run: node --test qa/acceptance/mini-boundaries.cjs
