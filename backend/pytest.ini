[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = common/tests accounts/tests users/tests catalog/tests cart/tests orders/tests promotions/tests reviews/tests
addopts = -q --cov=common --cov=accounts --cov=users --cov=catalog --cov=cart --cov=orders --cov=promotions --cov=reviews --cov-report=term-missing
